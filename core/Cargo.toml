[package]
name = "findmystar-core"
version = "0.1.0"
edition = "2021"
description = "Precision offline celestial computation engine"
license = "MIT"

[lib]
name = "findmystar_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libm = "0.2"
jni = { version = "0.21", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

# [dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }
# TODO: Re-enable when MSVC build tools are installed (VIS-006)

# [[bench]]
# name = "computation_benchmarks"
# harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
