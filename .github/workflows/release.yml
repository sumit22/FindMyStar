name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rust format check
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --all-targets

      - name: Validation tests
        run: cargo test --manifest-path core/Cargo.toml --test validation_tests

      - name: Edge case tests
        run: cargo test --manifest-path core/Cargo.toml --test edge_case_tests

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: mobile
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust core for Android (arm64)
        working-directory: core
        run: cargo build --target aarch64-linux-android --release
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang

      - name: Build Android AAB (Release)
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          FINDMYSTAR_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          FINDMYSTAR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINDMYSTAR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINDMYSTAR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

  ios-release:
    name: iOS Release Build
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust core for iOS (arm64)
        working-directory: core
        run: cargo build --target aarch64-apple-ios --release

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build iOS archive
        working-directory: mobile/ios
        run: |
          xcodebuild archive \
            -workspace FindMyStar.xcworkspace \
            -scheme FindMyStar \
            -configuration Release \
            -archivePath ../build/FindMyStar.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive
          path: mobile/build/FindMyStar.xcarchive
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android-release, ios-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-aab
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: ios-release-archive
          path: artifacts/ios

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android/*.aab
          draft: true
